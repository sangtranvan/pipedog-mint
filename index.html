<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PiPeDog — Mint</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0f16;color:#fff;min-height:100vh}
.wrap{max-width:920px;margin:auto;padding:32px 18px 60px}
.card{background:#121925;border:1px solid #263246;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0006}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.art{width:100%;aspect-ratio:1/1;border-radius:18px;object-fit:cover;border:1px solid #344157}
h1{font-size:44px;margin:0 0 8px}.sub{color:#aeb9cb;margin:0 0 24px}
.price{font-size:28px;font-weight:800;margin:12px 0}.small{font-size:14px;color:#9eabc0}
.row{display:flex;gap:10px;align-items:center;margin:18px 0}
.qty{display:flex;align-items:center;background:#0b111c;border:1px solid #334158;border-radius:14px;overflow:hidden}
.qty button{width:48px;height:46px;border:0;background:transparent;color:#fff;font-size:24px;cursor:pointer}
.qty span{width:54px;text-align:center;font-weight:700}
button.primary{flex:1;height:48px;border:0;border-radius:14px;background:#fff;color:#0b0f16;font-weight:800;font-size:16px;cursor:pointer;opacity:1!important}
button.primary:disabled{opacity:.55!important;cursor:not-allowed}
.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid #334158;border-radius:12px;color:#dce5f4;text-decoration:none;font-weight:700;background:#0b111c;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:#0b111c;border:1px solid #202c3e;border-radius:14px;padding:14px}
.stat b{display:block;font-size:20px;margin-top:4px}
.wallet{margin-top:12px;padding:12px;border-radius:12px;background:#0b111c;color:#aeb9cb;font-size:13px;word-break:break-all}
.status{margin-top:16px;min-height:22px;color:#dce5f4}
.notice{margin-top:10px;padding:10px 12px;border-radius:10px;background:#0b111c;border:1px solid #263246;color:#aeb9cb;font-size:13px;display:none}
.footer{margin-top:22px;color:#7f8da3;font-size:12px;line-height:1.6}
a{color:#b8d2ff}
@media(max-width:700px){.hero{grid-template-columns:1fr}h1{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="hero">
<div>
<img class="art" src="https://bafybeihmsvt46qcjqja56vuvvxgwzpfbqlrg6cs6twfyyt57iehze45mvi.ipfs.dweb.link" alt="PiPeDog Classic">
</div>
<div>
<h1>PiPeDog</h1>
<p class="sub">Minecraft-inspired NFT Collection on Robinhood Chain</p>
<div class="price">0.0033 ETH / NFT</div>
<div class="small">Mint 1–5 NFTs per transaction</div>

<div class="row">
<div class="qty">
<button id="minus">−</button><span id="qty">1</span><button id="plus">+</button>
</div>
<button class="primary" id="action">Connect Wallet</button>
</div>

<div id="notice" class="notice"></div>

<div class="stats">
<div class="stat"><span class="small">Remaining public</span><b id="remaining">483</b></div>
<div class="stat"><span class="small">Total Minted</span><b id="minted">17</b></div>
</div>

<div class="wallet" id="wallet">Wallet not connected</div>
<div class="status" id="status"></div>

<div class="row" style="margin-top:12px">
<a class="secondary" href="https://opensea.io/item/robinhood/0x08B89D3c1d2b2CBD25E965d7ebbEbd5400b14849/1" target="_blank" rel="noopener">View on OpenSea</a>
<a class="secondary" href="https://robinhoodchain.blockscout.com/address/0x08B89D3c1d2b2CBD25E965d7ebbEbd5400b14849" target="_blank" rel="noopener">View Contract</a>
</div>
</div>
</div>

<div class="footer">
Contract:
<a href="https://robinhoodchain.blockscout.com/address/0x08B89D3c1d2b2CBD25E965d7ebbEbd5400b14849" target="_blank" rel="noopener">0x08B89D3c1d2b2CBD25E965d7ebbEbd5400b14849</a><br>
Network: Robinhood Chain · Chain ID 4663 · ETH
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
<script>
const CONTRACT="0x08B89D3c1d2b2CBD25E965d7ebbEbd5400b14849";
const CHAIN_ID="0x1237";
const RPC="https://rpc.mainnet.chain.robinhood.com";
const ABI=[
  "function publicMint(uint256 quantity) payable",
  "function remainingPublic() view returns (uint256)",
  "function totalMinted() view returns (uint256)"
];

let walletProvider=null;
let provider=null;
let signer=null;
let contract=null;
let account=null;
let quantity=1;

const $=id=>document.getElementById(id);

function setStatus(text){$("status").textContent=text}

function updateUI(){
  $("qty").textContent=quantity;
  $("action").textContent=account
    ? `Mint ${quantity} NFT — ${(0.0033*quantity).toFixed(4)} ETH`
    : "Connect Wallet";
}

$("minus").onclick=()=>{
  if(quantity>1){quantity--;updateUI();}
};
$("plus").onclick=()=>{
  if(quantity<5){quantity++;updateUI();}
};

function announceProvider(event){
  const p=event.detail.provider;
  const info=event.detail.info||{};
  if(!walletProvider || /metamask/i.test(info.name||"") || /metamask/i.test(info.rdns||"")){
    walletProvider=p;
  }
  $("notice").style.display="none";
  setStatus("MetaMask found. Click Connect Wallet.");
  updateUI();
}

window.addEventListener("eip6963:announceProvider",announceProvider);

async function discoverWallet(){
  if(walletProvider) return walletProvider;
  if(window.ethereum){
    walletProvider=window.ethereum;
    return walletProvider;
  }
  window.dispatchEvent(new Event("eip6963:requestProvider"));
  await new Promise(resolve=>setTimeout(resolve,700));
  return walletProvider;
}

async function switchToRobinhood(){
  try{
    await walletProvider.request({
      method:"wallet_switchEthereumChain",
      params:[{chainId:CHAIN_ID}]
    });
  }catch(e){
    if(e.code!==4902) throw e;
    await walletProvider.request({
      method:"wallet_addEthereumChain",
      params:[{
        chainId:CHAIN_ID,
        chainName:"Robinhood Chain",
        nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18},
        rpcUrls:[RPC],
        blockExplorerUrls:["https://robinhoodchain.blockscout.com"]
      }]
    });
  }
}

async function connectWallet(){
  try{
    const p=await discoverWallet();

    if(!p){
      $("notice").style.display="block";
      $("notice").textContent="MetaMask was not found. Open MetaMask in your browser and reload the page.";
      setStatus("Không có ví EVM được trình duyệt cung cấp.");
      return;
    }

    setStatus("Opening MetaMask...");
    const accounts=await p.request({method:"eth_requestAccounts"});

    if(!accounts || !accounts[0]){
      throw new Error("No account was selected in MetaMask.");
    }

    walletProvider=p;

    await switchToRobinhood();

    provider=new ethers.BrowserProvider(walletProvider);
    signer=await provider.getSigner();
    account=await signer.getAddress();

    contract=new ethers.Contract(CONTRACT,ABI,signer);

    $("wallet").textContent=account;
    $("notice").style.display="none";
    setStatus("Wallet connected on Robinhood Chain. You can mint.");
    updateUI();
  }catch(e){
    setStatus(e.shortMessage||e.reason||e.message||"Could not connect wallet.");
    updateUI();
  }
}

async function mint(){
  try{
    if(!contract || !signer || !account){
      await connectWallet();
      if(!contract) return;
    }

    $("action").disabled=true;
    setStatus("Waiting for MetaMask confirmation...");

    const total=0.0033*quantity;
    const value=ethers.parseEther(total.toFixed(4));

    const tx=await contract.publicMint(quantity,{value});

    setStatus("Transaction submitted. Waiting for confirmation...");
    await tx.wait();

    $("status").innerHTML=
      `🎉 Mint successful! The NFT has been sent to your wallet.
       <div style="margin-top:8px">
       <a href="https://robinhoodchain.blockscout.com/tx/${tx.hash}" target="_blank" rel="noopener">
       View transaction on Blockscout →
       </a></div>`;

    await refreshStats();
  }catch(e){
    setStatus(e.shortMessage||e.reason||e.message||"Mint failed.");
  }finally{
    $("action").disabled=false;
    updateUI();
  }
}

$("action").onclick=()=>{
  if(account && contract) mint();
  else connectWallet();
};

async function refreshStats(){
  try{
    const readProvider=new ethers.JsonRpcProvider(RPC);
    const readContract=new ethers.Contract(CONTRACT,ABI,readProvider);

    const [remaining,minted]=await Promise.all([
      readContract.remainingPublic(),
      readContract.totalMinted()
    ]);

    $("remaining").textContent=remaining.toString();
    $("minted").textContent=minted.toString();
  }catch(e){
    console.warn("Stats:",e);
  }
}

window.dispatchEvent(new Event("eip6963:requestProvider"));
refreshStats();
updateUI();
</script>
</body>
</html>
